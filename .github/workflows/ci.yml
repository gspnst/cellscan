name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q
      - name: CLI smoke test
        env:
          CELLSCAN_HOME: ${{ runner.temp }}/cellscan
        run: |
          cellscan --version
          cellscan demo
          cellscan export latest -f csv | head -3
          cellscan decode lte --cell-id 26838293 --mcc 310 --mnc 260 --channel 66786

  kali:
    name: Install on Kali rolling
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling
    steps:
      - uses: actions/checkout@v5
      - name: Install system Python and tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv python3-pip rtl-sdr hackrf gpsd-clients modemmanager libqmi-utils
      - name: Install cellscan in a venv
        run: |
          python3 -m venv /opt/cellscan
          /opt/cellscan/bin/pip install ".[dev]"
          /opt/cellscan/bin/pytest -q
          CELLSCAN_HOME=/tmp/cs /opt/cellscan/bin/cellscan demo
          /opt/cellscan/bin/cellscan doctor

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
