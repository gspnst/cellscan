name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test and build
        run: |
          pip install -e ".[dev]" build
          pytest -q
          python -m build
      - name: GitHub release with wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "cellscan $GITHUB_REF_NAME" --generate-notes
